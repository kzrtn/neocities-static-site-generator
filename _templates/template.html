<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"> 
    <link href="styles.css" rel="stylesheet">
    <title>Blog</title>
  </head>
  <body>
    <div class="container viewpage"> <!--position-absolute top-50 start-50 translate-middle-->
      <!-- Updates box -->
      <div class="container" style="max-width: 40rem; padding: 0px">
        <div class="return-link"><a href="../blogs.html">Back to blog index</a></div>
      </div>
      
      <div class="container" style="max-width: 40rem;">
        <div class="row justify-content-md-center">
          <div class="about-inner-container" style="padding: 2px; border: 3px solid black">
            <div class="about-inner-container" style="padding: 4px; margin-top: 0px; border: 1px solid black">
              <div class="blog-header">
                <h3>{{title}}</h3>
                <div class="date">{{date}}</div>
              </div>
              <div class="about-inner-text">
                {{content}}
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="footer">
        This is some footer
      </div>
    </div>
  </body>
</html>
